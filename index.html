<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Checker</title>
    <link rel = "stylesheet" href = "style.css">
    <link rel ="icon" type="image/png" href = "todo.png">
</head>
<body>
    <div class = "minimalist-card">
        <h1>Your To-Do List</h1>
    </div>

    <div class = "columns">
        <div class = "card">
            <div class = "card-header">
                <h3> Incomplete Tasks </h3>
            </div>
            <div class = "card-body">
                <div class = "tasks">
                    Complete Task on Micromanaging Homework
                    <button class ="done">Done</button>
                </div>
                <button class = "add">
                    Add Tasks
                </button>
            </div>

        </div>

        <div class = "card">
            <div class = "card-header">
                <h3> Completed Tasks </h3>
            </div>
            <div class = "card-body">
                <div class = "tasks">
                    Complete Task on Micromanaging Homework
                </div>

            </div>

        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
